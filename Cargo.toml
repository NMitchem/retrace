[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

# At opt-level 0 a broken `set_simd` binding can still work by accident (the u128 argument happens to
# be left in v0), so the SIMD tests could not catch it. One level of optimisation makes a broken
# binding fail, which keeps those tests meaningful.
[profile.dev.package.hv-sys]
opt-level = 1
