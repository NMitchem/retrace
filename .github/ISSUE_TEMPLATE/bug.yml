name: retrace crashed or printed an internal error
description: "retrace printed the internal error banner (retrace: internal error) and exited 70"
title: "[bug] "
body:
  - type: markdown
    attributes:
      value: |
        A recording and a `RETRACE_TRACE` log contain the program's environment and output. Attach one only if nothing in it is secret: tokens, keys, passwords and private paths all travel with it. If in doubt, paste the single line and the command instead.
  - type: textarea
    id: line
    attributes:
      label: The banner line
      description: "The line that starts `retrace: internal error`, and anything printed after it."
      render: text
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: The command you ran
      description: The exact retrace command line.
      render: shell
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: retrace --version and sw_vers
      description: Paste the output of both.
      render: text
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: What the program does (optional)
      description: What the program is, or a small program that shows it.
    validations:
      required: false
