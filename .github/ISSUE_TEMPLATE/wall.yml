name: retrace stopped at a wall
description: "retrace printed a retrace: unsupported line and exited 4"
title: "[wall] "
body:
  - type: markdown
    attributes:
      value: |
        A recording and a `RETRACE_TRACE` log contain the program's environment and output. Attach one only if nothing in it is secret: tokens, keys, passwords and private paths all travel with it. If in doubt, paste the single line and the command instead.
  - type: textarea
    id: line
    attributes:
      label: The wall line
      description: "The whole line that starts `retrace: unsupported`."
      render: text
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: The command you ran
      description: The exact retrace command line.
      render: shell
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: retrace --version, brew list --versions retrace, and sw_vers
      description: Paste the output of all three. (--version prints 0.1.0 for every HEAD build; the brew line shows which one.)
      render: text
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: RETRACE_TRACE=1 log (optional)
      description: Rerun the same record command with `RETRACE_TRACE=1` and attach the end of the log. Read it for secrets first.
      render: text
    validations:
      required: false
