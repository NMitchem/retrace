[package]
name = "retrace"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "retrace"
path = "src/main.rs"

[dependencies]
retrace-core = { path = "../retrace-core" }
retrace-guest = { path = "../retrace-guest" }
# M19: the debug CLI reads the recording's opening Snapshot to build its symbol table, so the trace
# format is now a real dependency of the binary and not only of its tests.
retrace-trace = { path = "../retrace-trace" }
# M50: the CLI's panic hook and its top-level catch tell a wall from a bug by `Unsupported`.
retrace-arch = { path = "../retrace-arch" }

[dev-dependencies]
retrace-guest = { path = "../retrace-guest" }
retrace-trace = { path = "../retrace-trace" }
retrace-sim = { path = "../retrace-sim" }
# M52: semtimed_e2e states its timing bounds in the box's own clock stride and tick conversion.
retrace-box = { path = "../retrace-box" }
# M10: fdtable_e2e reads recorded events and asks `allocates_fd` which of them produced a
# descriptor, so the assertion tracks the shared table rather than restating syscall numbers.
retrace-arch = { path = "../retrace-arch" }
bincode = "1"
